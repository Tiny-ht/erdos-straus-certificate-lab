name: Certificate checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run certificate and transport tests
        run: python -m unittest discover -s tests -v
      - name: Replay deterministic evidence
        run: python scripts/reproduce.py --check
      - name: Verify published samples with explicit scopes
        run: |
          python -m erdos_straus verify examples/no_x_5_3.json --n 5 --x 3
          python -m erdos_straus verify examples/witness_5.json --n 5 --x 2
      - name: Check package installation and command entry point
        run: |
          python -m pip install .
          es-certs verify examples/no_x_5_3.json --n 5 --x 3

  lean:
    name: Lean 4.19.0 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          lake-package-directory: lean
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
      - name: Print theorem axiom dependencies
        working-directory: lean
        run: lake env lean Contracts.lean
